<!DOCTYPE html>
<!--
  Landing page del portfolio di Simone Fusco — PLACEHOLDER.
  Mostra "Portfolio" al centro e un grande pulsante per scaricare il CV in PDF.
  Da sviluppare in un secondo momento (progetti, bio, contatti, ecc.).
-->
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simone Fusco — Portfolio</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --btn-bg: #111111;
      --btn-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d0d;
        --fg: #f2f2f2;
        --btn-bg: #f2f2f2;
        --btn-fg: #0d0d0d;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(2rem, 8vh, 5rem);
      min-height: 100vh;
      padding: 5vw;
      text-align: center;
    }
    h1 {
      font-size: clamp(2rem, 10vw, 6rem);
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }
    .download-cv {
      display: inline-block;
      background: var(--btn-bg);
      color: var(--btn-fg);
      text-decoration: none;
      font-size: clamp(1.5rem, 6vw, 3.5rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: clamp(1.25rem, 5vw, 2.5rem) clamp(2rem, 9vw, 5rem);
      border-radius: 1rem;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .download-cv:hover,
    .download-cv:focus-visible {
      transform: scale(1.04);
      opacity: 0.9;
    }
    .download-cv:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <h1>Portfolio</h1>
  <a class="download-cv" href="Simone_Fusco_CV.pdf" download="Simone_Fusco_CV.pdf">Scarica CV</a>
</body>
</html>
