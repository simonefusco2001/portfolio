<!DOCTYPE html>
<!--
  Landing page del portfolio di Simone Fusco.
  Stile ispirato a shadcn/ui (https://github.com/shadcn-ui/ui): palette neutra,
  bordi sottili, radius generoso, tipografia Inter, badge + gerarchia visiva chiara.
  Ancora un placeholder di sezioni (progetti, bio estesa) da sviluppare in seguito.
-->
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simone Fusco — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: 0 0% 100%;
      --foreground: 240 10% 3.9%;
      --muted-foreground: 240 3.8% 46.1%;
      --border: 240 5.9% 90%;
      --primary: 240 5.9% 10%;
      --primary-foreground: 0 0% 98%;
      --radius: 0.75rem;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: 240 10% 3.9%;
        --foreground: 0 0% 98%;
        --muted-foreground: 240 5% 64.9%;
        --border: 240 3.7% 15.9%;
        --primary: 0 0% 98%;
        --primary-foreground: 240 5.9% 10%;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6vw 5vw;
      overflow: hidden;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    /* dot-grid di sfondo, sfumato verso i bordi — firma visiva tipica shadcn docs */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(hsl(var(--border)) 1px, transparent 1px);
      background-size: 24px 24px;
      -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 40%, black 40%, transparent 100%);
      mask-image: radial-gradient(ellipse 70% 55% at 50% 40%, black 40%, transparent 100%);
      pointer-events: none;
    }
    .badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 2rem;
      padding: 0.35rem 0.9rem;
      border: 1px solid hsl(var(--border));
      border-radius: 999px;
      background: hsl(var(--background));
      color: hsl(var(--muted-foreground));
      font-size: 0.8125rem;
      font-weight: 500;
    }
    .badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgb(34 197 94 / 0.18);
    }
    h1 {
      position: relative;
      font-size: clamp(2.75rem, 9vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
    }
    p.sub {
      position: relative;
      margin-top: 0.9rem;
      max-width: 32rem;
      color: hsl(var(--muted-foreground));
      font-size: clamp(0.95rem, 2vw, 1.125rem);
    }
    .cta {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 2.75rem;
      padding: 0.95rem 2rem;
      border: 1px solid hsl(var(--primary));
      border-radius: var(--radius);
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      text-decoration: none;
      font-size: 1.0625rem;
      font-weight: 600;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.06);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .cta svg { width: 18px; height: 18px; }
    .cta:hover, .cta:focus-visible { opacity: 0.88; transform: translateY(-1px); }
    .cta:active { opacity: 0.82; transform: translateY(0); }
    footer {
      position: relative;
      margin-top: 3.5rem;
      display: flex;
      gap: 1.5rem;
      font-size: 0.875rem;
    }
    footer a {
      color: hsl(var(--muted-foreground));
      text-decoration: none;
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    footer a:hover { color: hsl(var(--foreground)); border-color: hsl(var(--border)); }
  </style>
</head>
<body>
  <span class="badge"><span class="dot"></span>Aperto a nuove opportunità</span>
  <h1>Portfolio</h1>
  <p class="sub">Simone Fusco — Marketing, AI &amp; Data Analytics</p>
  <a class="cta" href="Simone_Fusco_CV.pdf" download="Simone_Fusco_CV.pdf">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    Scarica CV
  </a>
  <footer>
    <a href="mailto:simone.fusco2001@gmail.com">Email</a>
    <a href="https://www.linkedin.com/in/simone-fusco-2633a7331/" target="_blank" rel="noopener">LinkedIn</a>
  </footer>
</body>
</html>
