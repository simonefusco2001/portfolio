<!DOCTYPE html>
<!--
  Landing page del portfolio di Simone Fusco — PLACEHOLDER.
  Al momento mostra solo la scritta "Portfolio" centrata.
  Da sviluppare in un secondo momento (progetti, bio, contatti, ecc.).
-->
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simone Fusco — Portfolio</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d0d;
        --fg: #f2f2f2;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: clamp(2rem, 10vw, 6rem);
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <h1>Portfolio</h1>
</body>
</html>
